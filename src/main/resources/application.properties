spring.application.name=ogvpts
server.port=8080

# ---------- Veritabanı bağlantısı (Microsoft SQL Server) ----------
# Değerler ortam değişkenlerinden okunur; tanımlı değilse varsayılanlar kullanılır.
# Şifreyi buraya yazma: DB_PASSWORD ortam değişkenini ya da application-local.properties dosyasını kullan.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OGVPTS;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Yerel ayarlar (git'e gönderilmez): src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties

# ---------- JPA / Hibernate ----------
# Şema ogvpts_schema_sqlserver.sql betiğiyle kurulur; Hibernate tablolara dokunmaz.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Metin sütunları NVARCHAR olduğu için Türkçe karakterler doğru saklanır.
spring.jpa.properties.hibernate.type.prefer_nationalized=true
