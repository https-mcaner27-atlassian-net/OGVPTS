spring.application.name=ogvpts
server.port=8080

# ---------- Veritabanı bağlantısı (Microsoft SQL Server) ----------
# Değerler ortam değişkenlerinden okunur; tanımlı değilse varsayılanlar kullanılır.
# Şifreyi buraya yazma: DB_PASSWORD ortam değişkenini ya da application-local.properties dosyasını kullan.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OGVPTS;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Yerel ayarlar (git'e gönderilmez): src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties

# ---------- JPA / Hibernate ----------
# Şema ogvpts_schema_sqlserver.sql betiğiyle kurulur; Hibernate tablolara dokunmaz.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Metin sütunları NVARCHAR olduğu için Türkçe karakterler doğru saklanır.
spring.jpa.properties.hibernate.type.prefer_nationalized=true

# ---------- Güvenlik (JWT) ----------
# Token'ları imzalamak için gizli anahtar (en az 32 karakter). Üretimde mutlaka JWT_SECRET ortam değişkeniyle değiştir.
ogvpts.jwt.secret=${JWT_SECRET:gelistirme-icin-gizli-anahtar-en-az-32-karakter-olmali-OGVPTS}
# Giriş yapıldıktan sonra token kaç saat geçerli
ogvpts.jwt.expiration-hours=8
# React geliştirme sunucusunun adresi (CORS)
ogvpts.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Dosya yükleme (FR-06, FR-14) ----------
# Teslim dosyalarının saklanacağı klasör (proje klasörüne göre). .gitignore'da.
ogvpts.upload-dir=${UPLOAD_DIR:./uploads}
ogvpts.upload.allowed-extensions=pdf,doc,docx,zip,pptx
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# ---------- İş kuralları ----------
# FR-10: bir danışmana atanabilecek en fazla grup sayısı (kontenjan)
ogvpts.advisor.max-groups=8
# BR-03: onaylı randevu en az kaç saat önceden iptal edilebilir
ogvpts.meeting.cancel-min-hours=24

# ---------- Bildirim (FR-08) ----------
# true yapılırsa ve spring.mail.* ayarları girilirse bildirimler e-posta olarak da gönderilir.
ogvpts.mail.enabled=${MAIL_ENABLED:false}
ogvpts.mail.from=${MAIL_FROM:ogvpts@localhost}
# Örnek SMTP ayarları (application-local.properties içine yazılabilir):
# spring.mail.host=smtp.office365.com
# spring.mail.port=587
# spring.mail.username=...
# spring.mail.password=...
# spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- İlk yönetici hesabı ----------
# Veritabanında hiç yönetici yoksa uygulama açılırken bu bilgilerle bir yönetici oluşturulur.
ogvpts.bootstrap-admin.email=${ADMIN_EMAIL:}
ogvpts.bootstrap-admin.password=${ADMIN_PASSWORD:}
ogvpts.bootstrap-admin.full-name=${ADMIN_NAME:Sistem Yöneticisi}

# ---------- Swagger (API belgesi) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Diğer ----------
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
